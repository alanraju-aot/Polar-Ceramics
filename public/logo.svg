<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="polarLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE89C"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Polar Ceramics Geometric Emblem (Chamfered and Rounded Leaf/Tile Loop) -->
  <!-- Outer Shape: TL rounded (rx=32), TR chamfered (45 deg cut), BR rounded (rx=32), BL chamfered (45 deg cut) -->
  <!-- Inner Cutout: matching geometric contour with hollow center -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 42 12
       C 24 12 12 24 12 42
       L 12 84
       L 36 108
       L 78 108
       C 96 108 108 96 108 78
       L 108 36
       L 84 12
       L 42 12 Z

       M 50 36
       L 72 36
       L 84 48
       L 84 70
       C 84 78 78 84 70 84
       L 48 84
       L 36 72
       L 36 50
       C 36 42 42 36 50 36 Z"
    fill="url(#polarLogoGold)"
    filter="url(#logoGlow)"
  />
</svg>
