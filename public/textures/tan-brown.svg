<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <filter id="graniteTan">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.03" numOctaves="5" seed="64" result="noise" />
      <feColorMatrix type="matrix" values="
        0.5 0 0 0 0.35
        0 0.25 0 0 0.18
        0 0 0.18 0 0.12
        0 0 0 0.9 0.2" result="tanTint" />
      <feBlend mode="multiply" in="SourceGraphic" in2="tanTint" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="#2C1B14" filter="url(#graniteTan)" />
  <!-- Burgundy feldspar flowers -->
  <g fill="#6E2C1D" opacity="0.55">
    <ellipse cx="150" cy="180" rx="35" ry="25" />
    <ellipse cx="380" cy="120" rx="40" ry="30" />
    <ellipse cx="620" cy="220" rx="38" ry="28" />
    <ellipse cx="260" cy="380" rx="45" ry="32" />
    <ellipse cx="510" cy="410" rx="36" ry="26" />
    <ellipse cx="710" cy="500" rx="42" ry="30" />
    <ellipse cx="180" cy="620" rx="40" ry="28" />
    <ellipse cx="440" cy="680" rx="48" ry="35" />
    <ellipse cx="680" cy="720" rx="36" ry="26" />
  </g>
</svg>