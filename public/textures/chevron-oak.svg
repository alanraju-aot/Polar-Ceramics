<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <filter id="woodGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.004" numOctaves="4" seed="17" result="grain" />
      <feColorMatrix type="matrix" values="
        0.8 0 0 0 0.55
        0 0.5 0 0 0.35
        0 0 0.3 0 0.18
        0 0 0 0.3 0" result="woodTint" />
      <feBlend mode="multiply" in="SourceGraphic" in2="woodTint" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="#C49A6C" filter="url(#woodGrain)" />
  <!-- Chevron planks lines -->
  <g stroke="#784E27" stroke-width="3" opacity="0.65">
    <line x1="200" y1="0" x2="200" y2="800" stroke-width="4" stroke="#523215" />
    <line x1="400" y1="0" x2="400" y2="800" stroke-width="4" stroke="#523215" />
    <line x1="600" y1="0" x2="600" y2="800" stroke-width="4" stroke="#523215" />
    <!-- Chevron diagonal cuts -->
    
      <line x1="0" y1="0" x2="200" y2="100" />
      <line x1="200" y1="100" x2="400" y2="0" />
      <line x1="400" y1="0" x2="600" y2="100" />
      <line x1="600" y1="100" x2="800" y2="0" />
    
      <line x1="0" y1="100" x2="200" y2="200" />
      <line x1="200" y1="200" x2="400" y2="100" />
      <line x1="400" y1="100" x2="600" y2="200" />
      <line x1="600" y1="200" x2="800" y2="100" />
    
      <line x1="0" y1="200" x2="200" y2="300" />
      <line x1="200" y1="300" x2="400" y2="200" />
      <line x1="400" y1="200" x2="600" y2="300" />
      <line x1="600" y1="300" x2="800" y2="200" />
    
      <line x1="0" y1="300" x2="200" y2="400" />
      <line x1="200" y1="400" x2="400" y2="300" />
      <line x1="400" y1="300" x2="600" y2="400" />
      <line x1="600" y1="400" x2="800" y2="300" />
    
      <line x1="0" y1="400" x2="200" y2="500" />
      <line x1="200" y1="500" x2="400" y2="400" />
      <line x1="400" y1="400" x2="600" y2="500" />
      <line x1="600" y1="500" x2="800" y2="400" />
    
      <line x1="0" y1="500" x2="200" y2="600" />
      <line x1="200" y1="600" x2="400" y2="500" />
      <line x1="400" y1="500" x2="600" y2="600" />
      <line x1="600" y1="600" x2="800" y2="500" />
    
      <line x1="0" y1="600" x2="200" y2="700" />
      <line x1="200" y1="700" x2="400" y2="600" />
      <line x1="400" y1="600" x2="600" y2="700" />
      <line x1="600" y1="700" x2="800" y2="600" />
    
      <line x1="0" y1="700" x2="200" y2="800" />
      <line x1="200" y1="800" x2="400" y2="700" />
      <line x1="400" y1="700" x2="600" y2="800" />
      <line x1="600" y1="800" x2="800" y2="700" />
    
      <line x1="0" y1="800" x2="200" y2="900" />
      <line x1="200" y1="900" x2="400" y2="800" />
      <line x1="400" y1="800" x2="600" y2="900" />
      <line x1="600" y1="900" x2="800" y2="800" />
    
  </g>
</svg>