<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <pattern id="moroccanPattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#F4EFEA" stroke="#DDD" stroke-width="2" />
      <!-- Star & Knot -->
      <path d="M100,20 L125,75 L180,100 L125,125 L100,180 L75,125 L20,100 L75,75 Z" fill="#1C3F60" />
      <circle cx="100" cy="100" r="30" fill="#D39E36" />
      <circle cx="100" cy="100" r="14" fill="#F4EFEA" />
      <!-- Corner Petals -->
      <path d="M0,0 Q50,15 50,50 Q15,50 0,0" fill="#3D7B9A" />
      <path d="M200,0 Q150,15 150,50 Q185,50 200,0" fill="#3D7B9A" />
      <path d="M200,200 Q150,185 150,150 Q185,150 200,200" fill="#3D7B9A" />
      <path d="M0,200 Q50,185 50,150 Q15,150 0,200" fill="#3D7B9A" />
      <circle cx="100" cy="100" r="6" fill="#1C3F60" />
      <!-- Border accent -->
      <rect x="5" y="5" width="190" height="190" fill="none" stroke="#D39E36" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7" />
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#moroccanPattern)" />
</svg>