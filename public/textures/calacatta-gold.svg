<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <filter id="calacattaNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.003" numOctaves="5" seed="88" result="noise" />
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.98
        0 1 0 0 0.97
        0 0 1 0 0.95
        0.2 0.2 0.2 0 0.85" result="tint" />
      <feBlend mode="multiply" in="SourceGraphic" in2="tint" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="#FCFCFA" filter="url(#calacattaNoise)" />
  <!-- Dramatic Gold & Grey Veining -->
  <path d="M-80,100 C150,120 300,280 500,380 C680,470 780,600 880,720" stroke="#D4AF37" stroke-width="14" fill="none" opacity="0.5" filter="blur(8px)" />
  <path d="M-60,110 C160,130 310,270 490,390 C670,480 770,590 870,730" stroke="#B8860B" stroke-width="4" fill="none" opacity="0.65" filter="blur(1.5px)" />
  <path d="M-70,95 C140,115 315,285 510,375 C690,465 790,605 890,715" stroke="#7A8288" stroke-width="6" fill="none" opacity="0.3" filter="blur(4px)" />
  <path d="M450,-50 C380,220 580,400 480,700 T550,850" stroke="#C5A059" stroke-width="8" fill="none" opacity="0.4" filter="blur(5px)" />
  <path d="M120,500 C280,480 400,620 620,600 T820,780" stroke="#DAA520" stroke-width="5" fill="none" opacity="0.35" filter="blur(3px)" />
</svg>