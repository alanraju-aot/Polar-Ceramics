<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="customerWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2DDD5" />
      <stop offset="100%" stop-color="#C5BFB5" />
    </linearGradient>
    <linearGradient id="oldTileFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E8880" />
      <stop offset="100%" stop-color="#6B655D" />
    </linearGradient>
  </defs>
  <!-- Background Wall -->
  <rect width="1280" height="400" fill="url(#customerWall)" />
  <!-- Skirting Board / Baseboard -->
  <rect y="390" width="1280" height="20" fill="#5A4634" />
  <!-- Old Plain Floor -->
  <polygon points="0,410 1280,410 1280,720 0,720" fill="url(#oldTileFloor)" />
  <!-- Old faded tile grid lines in perspective -->
  <g stroke="#534D47" stroke-width="2" opacity="0.6">
    <line x1="640" y1="410" x2="640" y2="720" />
    <line x1="640" y1="410" x2="320" y2="720" />
    <line x1="640" y1="410" x2="0" y2="650" />
    <line x1="640" y1="410" x2="960" y2="720" />
    <line x1="640" y1="410" x2="1280" y2="650" />
    <line x1="0" y1="470" x2="1280" y2="470" />
    <line x1="0" y1="550" x2="1280" y2="550" />
    <line x1="0" y1="640" x2="1280" y2="640" />
  </g>
  <!-- Window with sunlight -->
  <rect x="80" y="60" width="220" height="280" fill="#FFF" stroke="#4A3B32" stroke-width="10" />
  <rect x="90" y="70" width="95" height="125" fill="#87CEEB" opacity="0.7" />
  <rect x="195" y="70" width="95" height="125" fill="#87CEEB" opacity="0.7" />
  <rect x="90" y="205" width="95" height="125" fill="#87CEEB" opacity="0.7" />
  <rect x="195" y="205" width="95" height="125" fill="#87CEEB" opacity="0.7" />
  <!-- Warm sunlight cast onto floor -->
  <polygon points="120,410 350,410 700,720 300,720" fill="#FFF" opacity="0.18" filter="blur(8px)" />
  <!-- Modern Lounge Chair in Customer Room -->
  <g transform="translate(820, 290)">
    <ellipse cx="140" cy="220" rx="110" ry="25" fill="#000" opacity="0.35" filter="blur(6px)" />
    <!-- Legs -->
    <line x1="80" y1="180" x2="60" y2="230" stroke="#111" stroke-width="6" stroke-linecap="round" />
    <line x1="200" y1="180" x2="220" y2="230" stroke="#111" stroke-width="6" stroke-linecap="round" />
    <!-- Armchair cushion -->
    <path d="M50,140 C50,90 80,60 140,60 C200,60 230,90 230,140 C230,180 210,195 140,195 C70,195 50,180 50,140 Z" fill="#D9822B" stroke="#B36518" stroke-width="3" />
    <path d="M70,80 C70,30 95,10 140,10 C185,10 210,30 210,80 Z" fill="#BD6E22" />
  </g>
  <!-- Wall Art -->
  <rect x="450" y="80" width="260" height="180" fill="#FFF" stroke="#222" stroke-width="8" />
  <circle cx="580" cy="170" r="50" fill="#D4AF37" />
  <path d="M500,200 L660,200" stroke="#333" stroke-width="6" />
  <!-- Text Tag in Corner -->
  <text x="50" y="690" font-family="sans-serif" font-size="20" fill="#FFF" opacity="0.85" font-weight="bold">CUSTOMER ROOM - UPLOADED PHOTO DEMO</text>
</svg>