<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <filter id="onyxNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.006" numOctaves="5" seed="99" result="noise" />
      <feColorMatrix type="matrix" values="
        0.1 0 0 0 0.12
        0 0.6 0 0 0.45
        0 0 0.4 0 0.32
        0 0 0 1 0" result="greenTint" />
      <feBlend mode="color-dodge" in="SourceGraphic" in2="greenTint" />
    </filter>
    <radialGradient id="onyxGlow" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#347856" />
      <stop offset="50%" stop-color="#1E4D36" />
      <stop offset="100%" stop-color="#0E2D1E" />
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#onyxGlow)" filter="url(#onyxNoise)" />
  <!-- Translucent bands -->
  <path d="M-80,300 C200,220 380,480 620,400 T880,620" stroke="#A3E4C1" stroke-width="26" fill="none" opacity="0.4" filter="blur(16px)" />
  <path d="M-80,300 C200,220 380,480 620,400 T880,620" stroke="#E2F7EC" stroke-width="6" fill="none" opacity="0.7" filter="blur(4px)" />
  <path d="M200,-50 C320,250 480,400 420,700 T700,850" stroke="#D1B875" stroke-width="10" fill="none" opacity="0.45" filter="blur(8px)" />
</svg>